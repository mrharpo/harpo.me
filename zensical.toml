[project]
site_url = "https://harpo.me/"
site_name = "Harpo!"
site_description = "Music and tech Wizardry"
site_author = "Harpo"
copyright = "Copyright &copy; 2026 Harpo"

repo_url = "https://github.com/mrharpo/harpo.me"
repo_name = "mrharpo/harpo.me"
edit_uri = "edit/main/docs/"
nav = [
    { "Home" = "index.md" },
    { "About" = "about.md" },
    { "Projects" = [
        "projects/index.md",
    ] },
    { "Contact" = "contact.md" },
]
# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.plugins.blog]
blog_dir = "projects"

[project.plugins.glightbox]

[project.plugins.tags]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    # "toc.follow",
    # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"


[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/quaternionmedia/qm"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }

[project.markdown_extensions.pymdownx]
arithmatex = { generic = true }
betterem = {}
blocks.caption = {}
caret = {}
details = {}
emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}
keys = {}
magiclink = {}
mark = {}
smartsymbols = {}
# snippets takes base_path = "includes" when there is an includes/ directory.
snippets = {}
superfences = { custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }
tabbed = { alternate_style = true, combine_header_slug = true }
tasklist = { custom_checkbox = true }
tilde = {}

[project.markdown_extensions.zensical.extensions.preview]
configurations = [
    { targets.include = [
        "customization.md",
        "setup/extensions/*",
    ] },
]
